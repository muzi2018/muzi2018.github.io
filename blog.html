---
layout: null
permalink: /blog.html
---
<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Log - Weijie Wang</title>
  <meta name="author" content="Weijie Wang">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="{{ '/assets/css/stylesheet.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/favicon-192x192.png' | relative_url }}">
</head>

<body>
<table style="width:100%;max-width:780px;border:0;border-spacing:0;border-collapse:separate;margin-right:auto;margin-left:auto;padding:24px 2.5% 60px 2.5%;">
  <tbody>
  <tr>
    <td>
      <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #eee;padding-bottom:12px;margin-bottom:16px;">
        <heading style="font-size:24px;font-weight:700;">Log</heading>
        <a href="{{ '/' | relative_url }}">&larr; Home</a>
      </div>

      {% for post in site.posts %}
      <div class="log-entry">
        <div class="log-header">
          <span class="log-date">[{{ post.date | date: "%Y-%m-%d" }}]</span>
          <a class="log-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </div>
        <div class="log-body">
          {{ post.content }}
        </div>
      </div>
      {% endfor %}

    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
