<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#f97316"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2; }
    .node { fill: #ffffff; stroke-width: 1.6; rx: 10; }
    .h1 { font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #64748b; }
    .pill-txt { font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Canvas Background -->
  <rect class="bg" x="2" y="2" width="676" height="286" rx="12"/>

  <!-- 1. TOP NODE: Control Policy (x=210..470, y=28..92) -->
  <rect class="node" x="210" y="28" width="260" height="64" stroke="#3b82f6"/>
  <text class="h1" x="340" y="55" text-anchor="middle" fill="#1d4ed8">控制策略 π_θ  &amp;  价值函数 V_ψ</text>
  <text class="sub" x="340" y="76" text-anchor="middle">输入观测与目标 g_t，输出关节指令 a_t</text>

  <!-- 2. BOTTOM-LEFT NODE: Physics Simulator (x=28..198, y=184..256) -->
  <rect class="node" x="28" y="184" width="170" height="72" stroke="#64748b"/>
  <text class="h1" x="113" y="213" text-anchor="middle" fill="#1e293b">物理仿真器 f_sim</text>
  <text class="sub" x="113" y="236" text-anchor="middle">MuJoCo 真值状态转移</text>

  <!-- 3. BOTTOM-CENTER NODE: Replay Buffer (x=255..425, y=184..256) -->
  <rect class="node" x="255" y="184" width="170" height="72" stroke="#10b981" stroke-dasharray="5 3"/>
  <text class="h1" x="340" y="213" text-anchor="middle" fill="#047857">循环经验池 B</text>
  <text class="sub" x="340" y="236" text-anchor="middle">(s_t, a_t, r_t, c_t, s_{t+1}, ξ)</text>

  <!-- 4. BOTTOM-RIGHT NODE: World Model (x=482..652, y=184..256) -->
  <rect class="node" x="482" y="184" width="170" height="72" stroke="#f97316"/>
  <text class="h1" x="567" y="213" text-anchor="middle" fill="#c2410c">可微世界模型 f̂_ω</text>
  <text class="sub" x="567" y="236" text-anchor="middle">共享动力学代理模型</text>

  <!-- ARROW ①: Policy -> Simulator (Left Curve) -->
  <path d="M 210 60 C 125 60, 113 105, 113 178" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <rect x="38" y="108" width="150" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text class="pill-txt" x="113" y="124" text-anchor="middle" fill="#334155">① 仿真采样（加噪声）</text>

  <!-- ARROW ①-b: Simulator -> Buffer (x=198..255) -->
  <path d="M 198 220 L 249 220" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- ARROW ②: Buffer -> World Model (x=425..482) -->
  <path d="M 425 220 L 476 220" fill="none" stroke="#f97316" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <rect x="378" y="142" width="152" height="24" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text class="pill-txt" x="454" y="158" text-anchor="middle" fill="#c2410c">② 8步拟合 + 抽起点 s_0</text>
  <path d="M 454 166 L 454 214" fill="none" stroke="#fdba74" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- ARROW ③: World Model -> Policy (Right Curve) -->
  <path d="M 567 184 C 567 105, 555 60, 476 60" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="492" y="108" width="150" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text class="pill-txt" x="567" y="124" text-anchor="middle" fill="#1d4ed8">③ 32步想象 + 反传梯度</text>
</svg>
