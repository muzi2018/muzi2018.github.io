<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>{{ page.title }} - Weijie Wang</title>
  <meta name="author" content="Weijie Wang">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="{{ '/assets/css/stylesheet.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/favicon-192x192.png' | relative_url }}">
</head>

<body class="log-page">
  <header class="log-hero">
    <div class="log-hero-inner">
      <h1><a href="{{ '/blog.html' | relative_url }}">Blog</a></h1>
      <a class="log-home" href="{{ '/' | relative_url }}">&larr; Home</a>
    </div>
  </header>

  <div class="log-stage">
    <div class="log-stream">
      <section class="log-year-group">
        <h2 class="log-year">{{ page.date | date: "%Y" }}</h2>
        <div class="log-item">
          <div class="log-rail" aria-hidden="true"><span class="log-dot"></span></div>
          <article class="log-card log-card-static">
            <div class="log-toggle">
              <time class="log-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%b %d, %Y" }}</time>
              <span class="log-title-row">
                <span class="log-title">{{ page.title }}</span>
              </span>
            </div>
            <div class="log-body">
              {{ content }}
            </div>
          </article>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
